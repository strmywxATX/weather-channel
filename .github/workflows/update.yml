name: Update weather data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Assemble the site
        run: |
          mkdir -p site/live
          cp index.html site/
          cp -r data site/data
          touch site/.nojekyll
          # start from the last published live data, so a failed source keeps its last good file
          if git fetch --depth 1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD live 2>/dev/null | tar -x -C site || true
          fi

      - name: Fetch live data
        run: python scripts/fetch.py site/live

      - name: Publish to the gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "weather-channel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
